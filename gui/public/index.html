<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DRISHTI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <a href="#/" class="brand" aria-label="Drishti home">
        <svg viewBox="0 0 64 64" aria-hidden="true" class="brand-logo">
          <defs>
            <linearGradient id="drishti-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#5b8cff" />
              <stop offset="100%" stop-color="#3ecf8e" />
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="26" fill="none" stroke="url(#drishti-g)" stroke-width="6" />
          <circle cx="32" cy="32" r="8" fill="url(#drishti-g)" />
          <path d="M8 32c5-9 14-14 24-14s19 5 24 14c-5 9-14 14-24 14S13 41 8 32Z" fill="none" stroke="url(#drishti-g)" stroke-width="4" />
        </svg>
        <span>Drishti</span>
      </a>
      <nav id="nav-global"></nav>
    </header>
    <main id="main-shell">
      <div id="error-banner" class="error-banner"></div>
      <div id="view-dashboard" class="view"></div>
      <div id="view-project" class="view" style="display: none"></div>
      <div id="view-config" class="view" style="display: none"></div>
      <div id="view-stats" class="view" style="display: none"></div>
      <div id="view-browse" class="view view-fs" style="display: none"></div>
      <div id="view-text" class="view view-fs" style="display: none"></div>
    </main>
    <div id="image-modal" class="image-modal" aria-hidden="true">
      <div class="image-modal-backdrop" id="image-modal-backdrop"></div>
      <div class="image-modal-inner">
        <button type="button" class="image-modal-close" id="image-modal-close" aria-label="Close">×</button>
        <div class="image-modal-toolbar">
          <button type="button" class="secondary" id="image-modal-prev">← Prev</button>
          <span id="image-modal-caption"></span>
          <button type="button" class="secondary" id="image-modal-next">Next →</button>
        </div>
        <div class="image-modal-stage">
          <img id="image-modal-img" alt="" />
        </div>
      </div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
